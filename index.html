<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    
    <main class="main">
        <div class="container">
            <div>
                <img src="./images/illustration-hero.svg" alt="hero-image">
            </div>
            <div class="heading">
                <h3>Order Summary</h3>
            </div>
            <div class="summary-para">
                <p>You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
                </div>
            <div class="centre">
                <img src="./images/icon-music.svg" alt="">
                <div class="plan-text">
                    <h3>Annual Plan</h3>
                    <p>$59.99/year</p>
                </div>
                <div class="change-link">
                    <a href="#">Change</a>
                </div>
            </div>
                <div class="proceed-btn">
                    <button>Proceed to Payment</button>
                </div>
                <div class="cancel-order">
                   <button>Cancel Order</button>
                    
                </div>
        </div>
        <footer>
            Challenge by <a href="https://www.crio.do" target="_blank">Crio.do.</a> Coded by <a href="https://github.com/Shahbaz9564" target="_blank">Md Shahbaz</a>
        </footer>
    </main>
</body>

</html>
